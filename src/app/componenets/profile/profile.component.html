<div class="profile-page">
  <h2>{{ auth.currentUser()?.username }}'s Articles</h2>

  <div class="article-row" *ngFor="let article of articles">
    <a [routerLink]="['/articles', article.id]">{{ article.title }}</a>
    <span class="status" [class.draft]="article.status === 'DRAFT'">{{ article.status }}</span>

    <div class="actions">
      <a [routerLink]="['/my-articles', article.id, 'edit']">Edit</a>
      <button *ngIf="article.status === 'DRAFT'" (click)="publish(article)">Publish</button>
      <button (click)="deleteArticle(article.id)">Delete</button>
    </div>
  </div>

  <p *ngIf="!articles.length">You haven't written any articles yet.</p>
</div>
